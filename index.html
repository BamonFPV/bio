<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BADLAN BAMON — Link Hub</title>
<meta name="description" content="Link hub BADLAN BAMON — Drone / FPV / Cinematic Travel Creator">
<style>
  :root{
    --bg:#060a12;
    --panel:rgba(255,255,255,.045);
    --border:rgba(255,255,255,.10);
    --text:#e8eef7;
    --muted:#8ba0b8;
    --cyan:#22d3ee;
    --orange:#f97316;
    --grad:linear-gradient(135deg,#22d3ee,#f97316);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--text);
    min-height:100vh; position:relative; overflow-x:hidden;
  }
  /* ambient glow + grain */
  body::before{
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(600px 420px at 85% -5%, rgba(34,211,238,.16), transparent 60%),
      radial-gradient(700px 500px at 5% 110%, rgba(249,115,22,.12), transparent 60%);
  }
  .stars{position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5;
    background-image:
      radial-gradient(1.2px 1.2px at 20% 30%, #fff, transparent),
      radial-gradient(1px 1px at 70% 15%, #cfe8ff, transparent),
      radial-gradient(1.4px 1.4px at 40% 70%, #fff, transparent),
      radial-gradient(1px 1px at 85% 55%, #cfe8ff, transparent),
      radial-gradient(1.2px 1.2px at 10% 85%, #fff, transparent),
      radial-gradient(1px 1px at 60% 90%, #fff, transparent),
      radial-gradient(1px 1px at 92% 80%, #fff, transparent);
  }
  .wrap{position:relative; z-index:1; max-width:520px; margin:0 auto;
    padding:56px 24px 64px;}
  /* ── profile ── */
  .avatar{
    width:120px; height:120px; margin:0 auto 20px; border-radius:50%;
    position:relative;
    background:linear-gradient(135deg,#22d3ee,#f97316);
    padding:3px;
    box-shadow:0 0 0 6px rgba(34,211,238,.10), 0 0 40px rgba(249,115,22,.25);
  }
  .avatar img{width:100%; height:100%; border-radius:50%; object-fit:cover; display:block;
    background:#0b1626;}
  .avatar .status{
    position:absolute; bottom:4px; right:4px; width:26px; height:26px; border-radius:50%;
    background:#22c55e; border:3px solid #060a12; box-shadow:0 0 10px rgba(34,197,94,.8);
  }
  .name{text-align:center; font-size:26px; font-weight:800; letter-spacing:.5px;}
  .name span{background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .tagline{text-align:center; color:var(--muted); font-size:14.5px; margin-top:8px; line-height:1.5;}
  .tagline b{color:#f97316; font-weight:600;}
  .socials{display:flex; justify-content:center; gap:12px; margin:22px 0 30px;}
  .soc{
    width:46px; height:46px; border-radius:14px; display:flex; align-items:center;
    justify-content:center; background:var(--panel); border:1px solid var(--border);
    color:var(--text); text-decoration:none; transition:.25s;
  }
  .soc:hover{transform:translateY(-3px); border-color:var(--cyan); color:var(--cyan);
    box-shadow:0 8px 24px rgba(34,211,238,.18);}
  .soc svg{width:22px; height:22px; fill:currentColor;}
  /* ── links ── */
  .links{display:flex; flex-direction:column; gap:14px;}
  .link{
    display:flex; align-items:center; gap:16px; text-decoration:none;
    background:var(--panel); border:1px solid var(--border);
    border-radius:18px; padding:16px 20px; color:var(--text);
    transition:.25s; position:relative; overflow:hidden;
    backdrop-filter:blur(10px);
  }
  .link::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:var(--grad); opacity:0; transition:.25s;
  }
  .link:hover{transform:translateY(-2px); border-color:rgba(34,211,238,.4);
    box-shadow:0 10px 30px rgba(0,0,0,.45);}
  .link:hover::before{opacity:1;}
  .link .icon{width:44px; height:44px; border-radius:12px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:20px;
    background:rgba(255,255,255,.06); border:1px solid var(--border);}
  .link .icon svg{width:22px; height:22px; fill:currentColor;}
  .link .txt{flex:1;}
  .link .t{font-size:15.5px; font-weight:600; display:block;}
  .link .d{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .link .arrow{color:var(--muted); font-size:18px; transition:.25s;}
  .link:hover .arrow{color:var(--cyan); transform:translateX(4px);}
  /* featured (bigger) */
  .link.feat{background:linear-gradient(135deg, rgba(34,211,238,.14), rgba(249,115,22,.12));
    border-color:rgba(34,211,238,.35);}
  /* ── footer ── */
  .foot{text-align:center; margin-top:40px; color:#5b7088; font-size:12.5px;}
  .foot b{color:#7f95ad;}
  .power{margin-top:6px; font-size:11.5px; letter-spacing:.5px;}
  .power i{color:#f97316; font-style:normal;}
</style>
</head>
<body>
<div class="stars"></div>
<div class="wrap">

  <!-- PROFILE -->
  <div class="avatar">
    <img src="" alt="BADLAN BAMON" id="avatarImg">
    <div class="status"></div>
  </div>
  <div class="name">BADLAN <span>BAMON</span></div>
  <div class="tagline">Drone · FPV · Cinematic Travel Creator<br>
    <b>&#9992; Explore &amp; Capture the World from Above</b></div>

  <!-- SOCIAL ROW -->
  <div class="socials" id="socialRow">
    <a class="soc" href="https://www.instagram.com/badlan_" target="_blank" rel="noopener" title="Instagram" data-save="instagram">
      <svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.9.1 1.2.1 1.8.3 2.2.4.6.2 1 .5 1.4.9.4.4.7.8.9 1.4.2.4.3 1 .4 2.2.1 1.3.1 1.7.1 4.9s0 3.6-.1 4.9c-.1 1.2-.3 1.8-.4 2.2-.2.6-.5 1-.9 1.4-.4.4-.8.7-1.4.9-.4.2-1 .3-2.2.4-1.3.1-1.7.1-4.9.1s-3.6 0-4.9-.1c-1.2-.1-1.8-.3-2.2-.4-.6-.2-1-.5-1.4-.9-.4-.4-.7-.8-.9-1.4-.2-.4-.3-1-.4-2.2-.1-1.3-.1-1.7-.1-4.9s0-3.6.1-4.9c.1-1.2.3-1.8.4-2.2.2-.6.5-1 .9-1.4.4-.4.8-.7 1.4-.9.4-.2 1-.3 2.2-.4 1.3-.1 1.7-.1 4.9-.1zm0 2c-3.1 0-3.5 0-4.8.1-1.1.1-1.5.2-1.8.4-.5.2-.8.4-1.1.7-.3.3-.5.6-.7 1.1-.2.3-.3.7-.4 1.8-.1 1.3-.1 1.7-.1 4.8s0 3.5.1 4.8c.1 1.1.2 1.5.4 1.8.2.5.4.8.7 1.1.3.3.6.5 1.1.7.3.2.7.3 1.8.4 1.3.1 1.7.1 4.8.1s3.5 0 4.8-.1c1.1-.1 1.5-.2 1.8-.4.5-.2.8-.4 1.1-.7.3-.3.5-.6.7-1.1.2-.3.3-.7.4-1.8.1-1.3.1-1.7.1-4.8s0-3.5-.1-4.8c-.1-1.1-.2-1.5-.4-1.8-.2-.5-.4-.8-.7-1.1-.3-.3-.6-.5-1.1-.7-.3-.2-.7-.3-1.8-.4-1.3-.1-1.7-.1-4.8-.1zm0 3.4a5.4 5.4 0 1 1 0 10.8 5.4 5.4 0 0 1 0-10.8zm0 2a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8zm5.6-3.6a1.3 1.3 0 1 1 0 2.6 1.3 1.3 0 0 1 0-2.6z"/></svg>
    </a>
  </div>

  <!-- LINKS -->
  <div class="links" id="links">
  </div>

  <div class="foot">
    <b>BADLAN BAMON</b> — FPV Cinematic Aerial<br>
    <div class="power">Built with <i>&#10022;</i> for the sky</div>
  </div>
</div>

<script>
  // ── KONFIGURASI LINK — edit di sini ──
  const PROFILE = {

  // Icon SVG (fill currentColor)
  const I = {

  // ── DAFTAR LINK — edit/urutkan di sini ──
  // featured: true → kartu lebih menonjol
  const LINKS = [
    { icon:"instagram",  href:"https://www.instagram.com/badlan_",   title:"Instagram",  desc:"@badlan_ — FPV & cinematic shots", featured:true },

  document.querySelector(".tagline").innerHTML = PROFILE.tagline.replace(/\n/g, "<br>");

  const box = document.getElementById("links");
  LINKS.forEach(l => {
    const a = document.createElement("a");
    a.className = "link" + (l.featured ? " feat" : "");
    a.href = l.href;
    a.target = l.href.startsWith("http") ? "_blank" : "_self";
    a.rel = "noopener";
    a.innerHTML = `<div class="icon">${I[l.icon]||'<span>🔗</span>'}</div>

</html>
